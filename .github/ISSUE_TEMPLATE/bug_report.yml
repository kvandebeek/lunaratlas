name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      value: |
        1.
        2.
        3.
        4.
        5.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other information
      description: Platform (macOS / Windows / Ubuntu), LunarAtlas version or commit, anything else relevant.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images into this box.
  - type: textarea
    id: files
    attributes:
      label: Additional Files
      description: Drag and drop logs or other files here (zip them if the type isn't supported).
